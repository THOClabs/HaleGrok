name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Least-privilege token for every job (supply-chain hardening, review R10).
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + Tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    # HARD GATE: both runners propagate real exit statuses and the full
    # estate is green (348/348 as of the Phase B remediation).  Any test
    # failure turns this job — and the PR — red.
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Alire
        # setup-alire publishes no immutable v3 tag (only a moving ref), so
        # this action cannot be SHA-pinned without freezing a branch head.
        uses: alire-project/setup-alire@v3
        with:
          version: "2.0.2"

      - name: Select GNAT toolchain
        run: alr --non-interactive toolchain --select gnat_native gprbuild

      - name: Show toolchain
        run: alr toolchain && alr exec -- gnatls --version

      - name: Build library
        run: alr -n build -- -XBUILD_MODE=${{ matrix.mode }}

      - name: Build test runners
        run: alr exec -- gprbuild -P ada/tests/hale_tests.gpr -p -j0 -XBUILD_MODE=${{ matrix.mode }}

      - name: Run legacy test suite
        run: ./ada/bin/run_tests

      - name: Run full test suite
        run: ./ada/bin/run_all_tests

  compile-gates:
    name: Compile gates (tests, examples, coverage)
    runs-on: ubuntu-latest
    # HARD GATE - no continue-on-error.  Uses the Ubuntu-archive GNAT so it
    # cannot be broken by Alire toolchain resolution issues.  Catches the
    # class of defect where sources referenced by no CI-built Main silently
    # bit-rot (review R7/Q-4/Q-5).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install GNAT + gprbuild (Ubuntu archive)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gnat-14 gprbuild
          for t in gnat gnatbind gnatchop gnatclean gnatkr gnatlink gnatls gnatmake gnatname gnatprep; do
            sudo ln -sf /usr/bin/${t}-14 /usr/local/bin/${t}
            sudo ln -sf /usr/bin/x86_64-linux-gnu-${t}-14 /usr/local/bin/x86_64-linux-gnu-${t} || true
          done

      - name: Build library (debug)
        run: gprbuild -P ada/hale_orbital.gpr -p -j0

      - name: Build both test runners
        run: gprbuild -P ada/tests/hale_tests.gpr -p -j0

      - name: Build all examples
        run: gprbuild -P ada/examples/hale_examples.gpr -p -j0

      - name: Compile coverage closure (no gnatcov needed)
        run: gprbuild -c -P ada/coverage.gpr -p -j0

      - name: coverage.gpr Units list in sync with ada/src
        # The Units list is a hand-maintained mirror of ada/src/*.ads; a new
        # package silently dropping out of coverage scope is a certification
        # defect (review Q-13).
        run: |
          expected=$(find ada/src -name '*.ads' -printf '%f\n' | sed 's/\.ads$//; s/-/./g' | sort)
          actual=$(grep -oE '"[a-z0-9_.]+"' ada/coverage.gpr | tr -d '"' | grep '^hale_orbital' | grep -v '\.gpr$' | sort -u)
          if ! diff <(echo "$expected") <(echo "$actual"); then
            echo "::error::ada/coverage.gpr Units list is out of sync with ada/src/*.ads (see diff above)"
            exit 1
          fi

  spark-flow:
    name: SPARK flow analysis (silver baseline)
    runs-on: ubuntu-latest
    # Informational: gnatprove is not an Alire 2.0.2 toolchain component and
    # AdaCore's apt repository is not reachable from CI, so no SPARK analysis
    # actually runs today.  Certification documents must NOT cite this job as
    # evidence (review R3).  Kept as a placeholder for a future SPARK-Pro or
    # GNAT-community install path.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Alire
        uses: alire-project/setup-alire@v3
        with:
          version: "2.0.2"

      - name: Select GNAT toolchain
        run: alr --non-interactive toolchain --select gnat_native

      - name: Attempt GNATprove flow analysis (informational)
        run: |
          if alr exec -- which gnatprove >/dev/null 2>&1; then
            alr exec -- gnatprove -P ada/hale_orbital.gpr --mode=flow --level=1 --report=fail
          else
            echo "::warning::gnatprove not installed in this CI environment; NO SPARK analysis ran (do not cite this job as verification evidence)."
          fi

  python-oracle:
    name: Python three-body validation oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies (pinned)
        run: |
          pip install --upgrade pip
          pip install -c python/three-body-extension/constraints.txt numpy scipy pytest ruff
          if [ -f python/three-body-extension/requirements.txt ]; then
            pip install -c python/three-body-extension/constraints.txt -r python/three-body-extension/requirements.txt
          fi
      - name: Lint (ruff)
        run: |
          cd python/three-body-extension
          python3 -m ruff check src tests ../../validation
      - name: Run three-body extension tests
        run: |
          cd python/three-body-extension
          pytest -x --tb=short
      - name: Cross-validation reference drift gate
        # Numeric compare (not byte compare): np.linalg.eig is BLAS-dispatch
        # CPU-dependent, so byte-exact CSV reproduction would flake across
        # heterogeneous runners.
        run: python3 validation/generate_reference.py --check

  doc-lint:
    name: Doc consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Check for stale-doc markers
        run: |
          # Catch accidental re-introduction of the archived persona narrative
          # at top level. Anything LOTR-named in .claude/ or docs/plans/ is
          # almost certainly a regression.
          if find .claude docs/plans -type f 2>/dev/null | grep -E '(frodo|gandalf|hobbit|bilbo|sam-wise)' ; then
            echo "::error::Archived persona narrative re-introduced; move to docs/history/"
            exit 1
          fi
          # Sanity: required current docs are present.
          for f in README.md docs/ARCHITECTURE.md docs/ROADMAP.md docs/history/README.md; do
            test -f "$f" || { echo "::error::Missing required doc: $f"; exit 1; }
          done
